# database connection properties
spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5433/habitrak
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# jwt config
jwt.secret.base64=${JWT_SECRET:244226452948404D6251655468576D5A7134743777217A25432A462D4A614E64}
jwt.access-token.expiration-time.ms=${JWT_EXPIRATION_TIME_MS:900000}
refresh-token.expiration-time.ms=${JWT_REFRESH_TOKEN_EXPIRATION_TIME_MS:86400000}

# cors config
cors.allowed-origins=*
cors.allowed-methods=*
cors.allowed-headers=*
cors.exposed-headers=*

# path settings
server.servlet.contextPath=${SERVLET_CONTEXT_PATH:/api}
loader.prefix=${LOADER_PREFIX:/loader}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs.html

# logging
logging.level.root=${LOGGING_LEVEL_ROOT:debug}

#filesystem
filesystem.type=LOCAL


server.port=${SERVER_PORT:8082}